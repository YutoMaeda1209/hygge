server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    location ^~ /auth {
        proxy_pass http://devcontainer:8080;
    }

    location ^~ /api {
        proxy_pass http://devcontainer:8080;
    }
}
