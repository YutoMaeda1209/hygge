services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - type: bind
        source: "../"
        target: "/workspace"
        consistency: cached
    command: sleep infinity
  db:
    image: postgres:18.6
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: password
  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080
  web:
    image: nginx:1.31.4
    volumes:
      - ../src/frontend:/usr/share/nginx/html
    ports:
      - "8080:80"
    environment:
      - NGINX_PORT=80
