name: Bug report
description: Template for reporting bugs and issues.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug.
        Please fill out the template below with as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Describe the bug in detail. Include screenshots or logs if available.
      placeholder: |
        The app crashes when I click the button.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
      placeholder: |
        Clicking the button should open the settings screen.
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: Provide step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Open the app
        2. Go to the home screen
        3. Click the "Settings" button
        4. App crashes
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide details about the environment where the bug occurred.
      placeholder: |
        - OS: Windows 10
        - Browser: Chrome 89.0.4389.90
        - App version: 1.2.3
    validations:
      required: true
  - type: checkboxes
    id: check_list
    attributes:
      label: Checklist
      description: Please check the following before submitting the bug.
      options:
        - label: I have provided detailed information for each item.
        - label: I have verified the issue occurs on the latest version.
        - label: I have checked that this issue has not already been reported.
    validations:
      required: true
